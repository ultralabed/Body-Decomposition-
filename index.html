<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Body Decomposition</title>
<meta name="description" content="可以旋轉、剝層、點選的 3D 人體肌肉骨骼圖：934 個構造，附起點、止點、動作、神經支配、關節動作示範與測驗。">
<meta name="theme-color" content="#0e1319">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <defs>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 17 9 5 9-5"/></symbol>
    <symbol id="i-body" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.2"/><path d="M6 9.5c2 .8 4 1.2 6 1.2s4-.4 6-1.2"/><path d="M12 10.7V15m0 0-3 6.5M12 15l3 6.5"/></symbol>
    <symbol id="i-muscle" viewBox="0 0 24 24"><path d="M4 18c0-4 1.5-6 4-7 .5-3 1.5-5 3.5-6.500 1.500 .5 2 1.500 2 2.500-1 1-1.500 2-1.500 3.500 3-.5 6 1.500 7.500 4.500"/><path d="M4 18c3 1.500 6.500 2 10 1.500 2.500-.3 4.500-1.200 5.500-4.500"/></symbol>
    <symbol id="i-motion" viewBox="0 0 24 24"><circle cx="14.500" cy="4.500" r="2"/><path d="m5 21 3.500-5 3-2 1-4.500L9 8l-3 3"/><path d="m12.500 9.500 3 3 3.500 1"/><path d="m11.500 14 3 3 .5 4"/></symbol>
    <symbol id="i-quiz" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.300 9.200a2.800 2.800 0 1 1 4 2.600c-.800.500-1.300 1.100-1.300 2"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-tools" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h3M11 12h9M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.500 12S6 5.500 12 5.500 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12Z"/><circle cx="12" cy="12" r="2.800"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16"/><path d="M9.500 5.900A9 9 0 0 1 12 5.500c6 0 9.500 6.500 9.500 6.500a17 17 0 0 1-3 3.700M6.300 7.700A16 16 0 0 0 2.500 12S6 18.500 12 18.500c1.300 0 2.500-.3 3.600-.800"/></symbol>
    <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M12 3.500c3.500 4 6 6.800 6 10a6 6 0 0 1-12 0c0-3.200 2.500-6 6-10Z"/><path d="M12 8v11.500" stroke-dasharray="1.500 2.500"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 3.500v17"/><path d="M12 7.500h6.800M12 12h8.500M12 16.500h6.800" stroke-width="1.200"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5 3.500 9.500 8 14"/><path d="M4 9.500h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.500-5.800"/><path d="M4 4v4.500h4.500"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.500h.01"/></symbol>
    <symbol id="i-multi" viewBox="0 0 24 24"><rect x="3.500" y="3.500" width="13" height="13" rx="2.500"/><path d="m7 10 2.500 2.500L13.500 8"/><path d="M8 20.500h10a2.500 2.500 0 0 0 2.500-2.500V8"/></symbol>
    <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4 9.500v5h3.500L12 19V5L7.500 9.500H4Z"/><path d="M15.500 9a4 4 0 0 1 0 6M18 6.500a7.500 7.500 0 0 1 0 11"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6.500-5.800 6.500-11a6.500 6.500 0 0 0-13 0c0 5.200 6.500 11 6.500 11Z"/><circle cx="12" cy="10" r="2.300"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.500-2.500h7L17 8h3v11H4V8Z"/><circle cx="12" cy="13" r="3.300"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.500"/><circle cx="17.500" cy="5.500" r="2.500"/><circle cx="17.500" cy="18.500" r="2.500"/><path d="m8.200 10.800 7-4M8.200 13.200l7 4"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.500 3.500h11V21L12 16.500 6.500 21V3.500Z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.500v15l12-7.500L7 4.500Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></symbol>
    <symbol id="i-showall" viewBox="0 0 24 24"><path d="M2.500 12S6 5.500 12 5.500 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12Z"/><path d="m9 12 2.200 2.200L15.500 10"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><path d="M5 4.500h14v12H9.500L5 20.500v-16Z"/><path d="M9 9h6M9 12.500h4"/></symbol>
  </defs>
</svg>

<div id="stage"><canvas id="gl" aria-label="3D 人體模型" data-t-attr="aria-label=3D 人體模型"></canvas><div id="labels" aria-hidden="true"></div></div>

<header id="top">
  <div class="top-row">
    <label class="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="搜尋肌肉、骨頭…（中文或英文）" aria-label="搜尋構造" data-t-attr="placeholder=搜尋肌肉、骨頭…（中文或英文）|aria-label=搜尋構造">
      <button id="q-clear" class="icon-btn" hidden aria-label="清除搜尋" data-t-attr="aria-label=清除搜尋"><svg class="ic"><use href="#i-x"/></svg></button>
    </label>
    <button id="lang-btn" aria-label="Switch to English">EN</button>
  </div>
  <div id="results" hidden></div>
</header>

<div id="views" role="group" aria-label="視角" data-t-attr="aria-label=視角">
  <button data-view="front" data-t="前" title="前面" data-t-attr="title=前面">前</button>
  <button data-view="back" data-t="後" title="後面" data-t-attr="title=後面">後</button>
  <button data-view="left" data-t="左" title="左側面" data-t-attr="title=左側面">左</button>
  <button data-view="right" data-t="右" title="右側面" data-t-attr="title=右側面">右</button>
  <button data-act="reset" aria-label="重設視角" title="重設視角" data-t-attr="aria-label=重設視角|title=重設視角"><svg class="ic"><use href="#i-reset"/></svg></button>
  <span class="sep"></span>
  <button data-act="undo" aria-label="復原上一步" title="復原上一步" data-t-attr="aria-label=復原上一步|title=復原上一步" disabled><svg class="ic"><use href="#i-undo"/></svg></button>
  <button data-act="showall" aria-label="全部顯示" title="全部顯示" data-t-attr="aria-label=全部顯示|title=全部顯示"><svg class="ic"><use href="#i-showall"/></svg></button>
</div>

<div id="peel" role="group" aria-label="剝層" data-t-attr="aria-label=剝層"></div>

<div id="selbar" hidden></div>

<section id="sheet" hidden aria-live="polite">
  <header>
    <h2 id="sheet-title"></h2>
    <button id="sheet-close" class="icon-btn" aria-label="關閉面板" data-t-attr="aria-label=關閉面板"><svg class="ic"><use href="#i-x"/></svg></button>
  </header>
  <div id="sheet-body"></div>
</section>

<nav id="tabs" aria-label="主選單" data-t-attr="aria-label=主選單">
  <button data-tab="layers"><svg class="ic"><use href="#i-layers"/></svg><span data-t="圖層">圖層</span></button>
  <button data-tab="regions"><svg class="ic"><use href="#i-body"/></svg><span data-t="部位">部位</span></button>
  <button data-tab="groups"><svg class="ic"><use href="#i-muscle"/></svg><span data-t="肌群">肌群</span></button>
  <button data-tab="motions"><svg class="ic"><use href="#i-motion"/></svg><span data-t="動作@tab">動作</span></button>
  <button data-tab="quiz"><svg class="ic"><use href="#i-quiz"/></svg><span data-t="測驗">測驗</span></button>
  <button data-tab="tools"><svg class="ic"><use href="#i-tools"/></svg><span data-t="工具">工具</span></button>
</nav>

<div id="tip" hidden aria-hidden="true"></div>
<div id="toast" hidden role="status"></div>

<div id="loading">
  <div class="load-card">
    <div class="load-title">Body Decomposition</div>
    <div class="load-sub" data-t="3D 肌肉骨骼分層圖">3D 肌肉骨骼分層圖</div>
    <div class="bar"><i id="load-bar"></i></div>
    <div id="load-text" data-t="正在載入模型…">正在載入模型…</div>
    <div class="load-credit" data-t="模型：BodyParts3D © 日本生命科學資料庫中心（DBCLS），CC BY-SA 2.1 JP">模型：BodyParts3D © 日本生命科學資料庫中心（DBCLS），CC BY-SA 2.1 JP</div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
